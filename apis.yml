aid: r-zero
name: R-Zero
description: 'R-Zero Systems is a San Francisco based building-intelligence company
  founded in 2020 that combines privacy-first occupancy sensors, indoor-air-quality
  monitoring and AI to autonomously optimize HVAC ventilation in commercial real estate,
  healthcare and higher-education buildings, claiming 20-40% HVAC energy savings without
  retrofits or capital investment. Its software platform, R-Zero Connect, turns raw
  sensor telemetry into occupancy analytics, space-utilization insights and portfolio
  reporting. R-Zero acquired the workplace-sensor company CoWorkr, whose platform still
  carries the company''s developer surface: a REST API for pulling historical workplace
  utilization data into BI tooling and a Node.js/DDP Stream API that pushes real-time
  occupancy events into reservation and workplace-experience applications (AgilQuest,
  Comfy, iOffice Hummingbird, Serraview, Teem, Tactic, Siemens). Both APIs are account-gated
  - documentation is served inside the authenticated application and access is granted
  on request - so no public OpenAPI, GraphQL, MCP or A2A surface is published.'
