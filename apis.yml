- aid: r-zero:coworkr-stream-api
  name: CoWorkr Stream API
  description: 'CoWorkr''s real-time Stream API. Built on Node.js and DDP (the Meteor
    Distributed Data Protocol), it pushes utilization sensor updates as they happen
    - a raw feed used by partner workplace-experience and room-booking applications
    to show live desk/room availability and auto-cancel ghosted reservations. Account-gated
    like the REST API; no AsyncAPI document is published.'
