- aid: r-zero:coworkr-rest-api
  name: CoWorkr REST API
  description: 'CoWorkr''s standard REST API for pulling workplace analytical data
    - historical and current occupancy, utilization and device records for WorkPoints,
    WorkSpace Counters, WorkHubs, WorkPlaces, FloorPlans and Tags - into BI tools and
    reporting workflows. Documentation is linked from the top-right drop-down of the
    authenticated CoWorkr application; access is permission-gated and requested from
    R-Zero support.'
